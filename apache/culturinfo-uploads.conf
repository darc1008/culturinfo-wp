<Directory "/var/www/html/wp-content/uploads">
    Options -ExecCGI -Indexes
    AllowOverride None

    RemoveHandler .php .php3 .php4 .php5 .php7 .php8 .phtml .pht .phar .cgi .pl .py .sh
    RemoveType .php .php3 .php4 .php5 .php7 .php8 .phtml .pht .phar .cgi .pl .py .sh

    <FilesMatch "(?i)\.(php[0-9]?|phtml|pht|phar|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
</Directory>
